<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minnesota Vikings Quiz Challenge</title>
    <link rel="icon" type="image" href="C:\Users\Jkrag\AppData\Local\hermes\cache\documents\native-inputs\de83e8cef4c3f5536c33f8f363af5d778e1277ac6736159face5f31e0f163ce0\dashboard_20261104_214933_4e57d12b_image_1099e7.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #2a0a5c 0%, #4F2683 50%, #FFC62F 100%);
            min-height: 100vh;
            padding: 20px;
            color: #fff;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            padding: 30px 20px;
            background: linear-gradient(135deg, #4F2683 0%, #3a0c78 100%);
            border-radius: 15px;
            border: 4px solid #FFC62F;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #FFC62F;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1rem;
            color: #fff;
        }

        .quiz-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            min-height: 400px;
        }

        .welcome-screen {
            text-align: center;
        }

        .welcome-screen h2 {
            color: #4F2683;
            font-size: 2rem;
            margin-bottom: 20px;
        }

        .start-btn {
            background: linear-gradient(135deg, #FFC62F 0%, #e6ac1f 100%);
            color: #4F2683;
            border: none;
            padding: 15px 50px;
            font-size: 1.3rem;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
        }

        .start-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        .question {
            display: none;
        }

        .question.active {
            display: block;
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .question-number {
            color: #4F2683;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
        }

        .question-text {
            font-size: 1.4rem;
            color: #2a0a5c;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .option-btn {
            background: linear-gradient(135deg, #e8e8e8 0%, #ffffff 100%);
            border: 2px solid #4F2683;
            padding: 18px 25px;
            font-size: 1.1rem;
            text-align: left;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            color: #4F2683;
            font-weight: 500;
        }

        .option-btn:hover:not(:disabled) {
            background: linear-gradient(135deg, #FFC62F 0%, #e6ac1f 100%);
            color: #4F2683;
            transform: translateX(10px);
        }

        .option-btn:disabled {
            cursor: not-allowed;
            opacity: 0.7;
        }

        .option-btn.correct {
            background: linear-gradient(135deg, #4CAF50 0%, #3d8b40 100%);
            color: white;
            border-color: #4CAF50;
        }

        .option-btn.incorrect {
            background: linear-gradient(135deg, #f44336 0%, #c62828 100%);
            color: white;
            border-color: #f44336;
        }

        .feedback {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            font-weight: bold;
            text-align: center;
            display: none;
        }

        .feedback.correct {
            background: #d4edda;
            color: #155724;
            border: 2px solid #c3e6cb;
        }

        .feedback.incorrect {
            background: #f8d7da;
            color: #721c24;
            border: 2px solid #f5c6cb;
        }

        .result-screen {
            display: none;
            text-align: center;
            animation: fadeIn 0.5s ease-in;
            padding: 20px;
            margin: auto;
            max-width: 100%;
        }

        .result-screen.active {
            display: block;
        }
        
        #result-message {
            margin-bottom: 15px;
            font-weight: bold;
            text-align: center;
        }

        #final-score {
            text-align: center;
        }

        .restart-btn {
            color: #4F2683;
            border: none;
            padding: 15px 50px;
            font-size: 1.2rem;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
        }

        .restart-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e9ecef;
            border-radius: 4px;
            margin-bottom: 25px;
            overflow: hidden;
        }

        .score-value {
            font-size: 1.8rem;
            color: #4F2683;
            font-weight: bold;
        }

        .score-value.live {
            font-size: 1.5rem;
        }

        .result-message {
            font-size: 1.8rem;
            color: #4F2683;
            margin-bottom: 15px;
            font-weight: bold;
            text-align: center;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #FFC62F 0%, #f8c43b 100%);
            border-radius: 4px;
            transition: width 0.5s ease-in;
        }

        #live-score {
            text-align: center;
            margin-bottom: 15px;
            padding: 15px;
            background: linear-gradient(135deg, #e8f4fd 0%, #d0e3fa 100%);
            border-radius: 10px;
            border: 2px solid #4F2683;
        }

        @media (max-width: 600px) {
            .header h1 {
                font-size: 1.8rem;
            }

            .question-text {
                font-size: 1.1rem;
            }

            .option-btn {
                padding: 15px 20px;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <img src="C:\Users\Jkrag\AppData\Local\hermes\cache\documents\native-inputs\de83e8cef4c3f5536c33f8f363af5d778e1277ac6736159face5f31e0f163ce0\dashboard_20261104_214933_4e57d12b_image_1099e7.png" alt="Minnesota Vikings Logo" style="width: 120px; height: auto; margin-bottom: 15px;">
            <h1>Minnesota Vikings Quiz</h1>
            <p>Test your knowledge of the greatest franchise in NFL history!</p>
        </header>

        <div class="quiz-container">
            <div id="welcome-screen" class="welcome-screen">
                <h2>🏈 Ready to Prove Your Vikings Knowledge?</h2>
                <p style="margin: 20px 0; color: #666;">Answer 6 questions about the Minnesota Vikings</p>
                <button class="start-btn" onclick="startQuiz()">Start Quiz</button>
            </div>

            <div id="quiz-content" style="display: none;">
                <div class="progress-bar">
                    <div id="progress-fill" class="progress-fill" style="width: 0%"></div>
                </div>
                <!-- Live score counter visible during quiz -->
                <div id="live-score" style="text-align: center; margin-bottom: 15px;">
                    <strong style="color: #4F2683; font-size: 1.3rem;">Your Score:</strong>
                    <span id="score-number" class="score-value live">0</span><span style="color: #4F2683;">/6 questions correct</span>
                </div>
                <div id="questions-container"></div>
            </div>

            <div id="result-screen" class="result-result-screen">
                <div style="margin-bottom: 15px; display: flex; align-items: center; justify-content: center;">
                    <h2 id="quiz-complete-header" style="color: #4F2683; display: none; margin: 0; text-align: center;">Quiz Complete!</h2>
                </div>
                <span id="final-score" class="score-value live" style="display: none;"></span>
                <div id="result-message" class="result-message"></div>
                <button id="play-again-btn" class="restart-btn" style="display: none; margin: 10px auto;" onclick="resetQuiz()">Play Again</button>
            </div>
        </div>
    </div>

    <script>
        const quizData = [
            {
                question: "Who is the Vikings all time leader in passing yards?",
                options: [
                    "A) Christian Ponder",
                    "B) Fran Tarkenton",
                    "C) Warren Moon",
                    "D) Daunte Culpepper"
                ],
                answer: 1 // Index of correct answer (B = index 1)
            },
            {
                question: "Who is the all time leader in Vikings history with 110 total touchdowns?",
                options: [
                    "A) Adrian Peterson",
                    "B) Randy Moss",
                    "C) Chris Carter",
                    "D) Chuck Foreman"
                ],
                answer: 2 // Index of correct answer (C = index 2)
            },
            {
                question: "What Vikings Kicker has the team record for most field goals made?",
                options: [
                    "A) Fred Cox",
                    "B) Blair Walsh",
                    "C) Gary Anderson",
                    "D) Ryan Longwell"
                ],
                answer: 0 // Index of correct answer (A = index 0)
            },
                        {
                question: "Which head coach has the most wins in vikings history?",
                options: [
                    "A) Bud Grant",
                    "B) Kevin O'Connell",
                    "C) Dennis Green",
                    "D) Mike Zimmer"
                ],
                answer: 0 // Index of correct answer (A = index 0)
            },
            {
                question: "Who holds the Vikings record for single season receiving yards?",
                options: [
                    "A) Justin Jefferson",
                    "B) Randy Moss",
                    "C) Adam Thielen",
                    "D) Sidney Rice"
                ],
                answer: 0 // Index of correct answer (A = index 0)
            },
            {
                question: "What year did Adrian Peterson win NFL MVP?",
                options: [
                    "A) 2008",
                    "B) 2015",
                    "C) 2012",
                    "D) 2009"
                ],
                answer: 2 // Index of correct answer (C = index 2)
            }
        ];

        let currentQuestion = 0;
        let score = 0;

        function startQuiz() {
            document.getElementById('welcome-screen').style.display = 'none';
            document.getElementById('quiz-content').style.display = 'block';
            document.getElementById('result-screen').classList.remove('active');
            currentQuestion = 0;
            score = 0;
            updateLiveScore();
            loadQuestion();
        }

        function loadQuestion() {
            const container = document.getElementById('questions-container');
            const questionData = quizData[currentQuestion];
            
            const questionHTML = `
                <div class="question active">
                    <div class="question-number">Question ${currentQuestion + 1} of ${quizData.length}</div>
                    <div class="question-text">${questionData.question}</div>
                    <div class="options" id="options-${currentQuestion}"></div>
                    <div class="feedback" id="feedback-${currentQuestion}"></div>
                </div>
            `;
            
            container.innerHTML = questionHTML;
            updateProgress();
            
            const optionsContainer = document.getElementById(`options-${currentQuestion}`);
            questionData.options.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = option;
                btn.onclick = () => checkAnswer(index, currentQuestion);
                optionsContainer.appendChild(btn);
            });
        }

        function checkAnswer(selectedIndex, questionIndex) {
            const questionData = quizData[questionIndex];
            const optionsContainer = document.getElementById(`options-${questionIndex}`);
            const feedbackElement = document.getElementById(`feedback-${questionIndex}`);
            
            const buttons = optionsContainer.querySelectorAll('.option-btn');
            buttons.forEach(btn => btn.disabled = true);
            
            if (selectedIndex === questionData.answer) {
                score++;
                buttons[selectedIndex].classList.add('correct');
                feedbackElement.textContent = "🎉 Correct! That's the right answer.";
                feedbackElement.className = "feedback correct";
            } else {
                buttons[selectedIndex].classList.add('incorrect');
                buttons[questionData.answer].classList.add('correct');
                feedbackElement.textContent = `❌ Incorrect. The correct answer was: ${questionData.options[questionData.answer]}`;
                feedbackElement.className = "feedback incorrect";
            }
            
            feedbackElement.style.display = 'block';
            
            setTimeout(() => {
                updateLiveScore();
                nextQuestion();
            }, 1500);
        }

        function updateLiveScore() {
            const quizContent = document.getElementById('quiz-content');
            const resultScreen = document.getElementById('result-screen');
            // Only update if we're on the quiz screen (not results)
            if (quizContent && quizContent.style.display !== 'none' && !resultScreen.classList.contains('active')) {
                const scoreNumber = document.getElementById('score-number');
                if (scoreNumber) {
                    scoreNumber.textContent = score;
                }
            }
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion < quizData.length) {
                updateLiveScore();
                loadQuestion();
            } else {
                showResults();
            }
        }

        function updateProgress() {
            const progress = ((currentQuestion) / quizData.length) * 100;
            document.getElementById('progress-fill').style.width = `${progress}%`;
        }

        function showResults() {
            document.getElementById('quiz-content').style.display = 'none';
            const resultScreen = document.getElementById('result-screen');
            resultScreen.classList.add('active');
            
            // Show the Quiz Complete! header
            const quizCompleteHeader = document.getElementById('quiz-complete-header');
            if (quizCompleteHeader) quizCompleteHeader.style.display = 'block';
            
            const scoreValue = document.getElementById('final-score');
            if (scoreValue) {
                scoreValue.style.display = 'inline';
                scoreValue.innerHTML = `${score}/6 <span style="color: #4F2683;">questions correct</span>`;
            }
            
            // Show Play Again button at bottom
            const playAgainBtn = document.getElementById('play-again-btn');
            if (playAgainBtn) playAgainBtn.style.display = 'block';
            
            let message = "";
            if (score === quizData.length) {
                message = "🏆 You're in the Ring of Honor! Perfect score!";
            } else if (score >= 4) {
                message = "💪 You're a real Skoldier! Great job!";
            } else if (score >= 3) {
                message = "👍 Not bad! Keep studying Vikings history.";
            } else {
                message = "⚠️ Time to go back to training camp. Study up, Viking!";
            }
            
            document.getElementById('result-message').textContent = message;
        }

        function resetQuiz() {
            document.getElementById('result-screen').classList.remove('active');
            // Refresh the page to fully reset everything
            window.location.reload();
        }
    </script>
</body>
</html>
